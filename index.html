@keyframes fadeUp{from{opacity:0;transform:translateY(16px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}

.cn-serif{font-family:'Newsreader',Georgia,serif;font-optical-sizing:auto}
.cn-kicker{font-family:'Inter',system-ui,sans-serif;font-size:10px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;font-style:normal;color:#fff}
.cn-rule{height:1px;background:rgba(255,255,255,.55)}
.cn-boxbtn{color:#fff;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.55);padding:12px 46px 14px;border-radius:0;letter-spacing:.02em;transition:background .4s,color .4s,border-color .4s}
.cn-boxbtn:hover{background:#fff;color:#050506;border-color:#fff}
.cn-link{color:#fff;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.45);padding:0 0 3px;transition:border-color .35s,opacity .35s,letter-spacing .35s}
.cn-link:hover{border-bottom-color:#fff}
.cn-link:disabled{opacity:.35;cursor:default}
.cn-hover{color:#fff;background:none;border:0;transition:opacity .3s}
.cn-hover:hover{opacity:.6}
.cn-line{background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.35);color:#fff;outline:none;padding:6px 0 12px;border-radius:0;transition:border-color .4s}
.cn-line:focus{border-bottom-color:#fff}
.cn-line::placeholder{color:rgba(255,255,255,.4)}
.cn-drop::first-letter{float:left;font-size:3.6em;line-height:.82;padding:6px 10px 0 0;font-weight:200}
.cn-sans{font-family:'Inter',system-ui,sans-serif}

.cn-gold{color:#fff}
.cn-input{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:#fff;outline:none;transition:border-color .3s,background .3s,box-shadow .3s}
.cn-input:focus{border-color:rgba(234,215,164,.55);background:rgba(255,255,255,.06);box-shadow:0 0 0 4px rgba(234,215,164,.08)}
.cn-input::placeholder{color:rgba(230,226,218,.32)}
.cn-btn{transition:all .35s ease}
.cn-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.cn-chip{transition:all .3s ease;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03)}
.cn-chip:hover{border-color:rgba(255,255,255,.5);color:#fff;background:rgba(255,255,255,.08)}
.cn-fade{transition:opacity .9s ease, transform .9s ease, filter .9s ease}
.cn-scroll::-webkit-scrollbar{width:4px}.cn-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
